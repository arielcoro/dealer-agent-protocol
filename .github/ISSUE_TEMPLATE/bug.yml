name: Implementation defect
description: Report a reproducible problem in schemas, tests, sites, or reference code.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, customer data, private vehicle records, or vulnerability details."
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, including the smallest reproducible input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Protocol or release version
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Interoperability or safety impact
    validations:
      required: true
