[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealer-agent-client"
version = "0.1.0.dev1"
description = "Typed safety helpers for Dealer Agent Protocol clients"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["src"]
