[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealer-agent-protocol-reference"
version = "0.1.0.dev1"
description = "Non-production reference Dealer Agent Gateway for Dealer Agent Protocol 0.1"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "uvicorn>=0.30,<1"
]

[project.scripts]
dealer-agent-protocol-reference = "dealer_agent_protocol_reference.server:main"
dealer-agent-protocol-http = "dealer_agent_protocol_reference.http:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dealer_agent_protocol_reference*"]
